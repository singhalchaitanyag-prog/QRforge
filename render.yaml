# Blueprint for Render (render.com). Other Node hosts (Railway, Fly.io) read package.json instead:
#   build:  npm ci && npm run build        start:  npm start
services:
  - type: web
    name: qrforge
    runtime: node
    plan: starter            # always on. The free plan sleeps when idle, which makes QR scans slow.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: BASE_URL
        value: https://qrforge.co.in
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: TURSO_DATABASE_URL
        value: libsql://qrforge-chaitanyagsinghal.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false          # you type this in the Render dashboard; it is never stored in this file
      - key: APP_SECRET
        sync: false          # same value as in your local .env, typed in the dashboard
